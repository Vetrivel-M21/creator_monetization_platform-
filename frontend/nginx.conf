server {
    listen 80;
    server_name localhost;

    # Allow up to 500MB video uploads through Nginx
    client_max_body_size 500M;

    # Gzip Compression for web performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API Endpoints
    location /api/ {
        proxy_pass http://backend:8085/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Video Thumbnails
    location /thumbnails/ {
        proxy_pass http://backend:8085/thumbnails/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Channel Logos
    location /logos/ {
        proxy_pass http://backend:8085/logos/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Video Stream Data & HLS Playlists
    location /data/ {
        proxy_pass http://backend:8085/data/;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin *;
    }
}

services:
  # Go Backend API Service (Internal Docker network only)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creator_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 2085
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-creator_platform}
    # Internal only: backend is never exposed directly to host/internet
    expose:
      - "2085"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # CRITICAL: Persists uploaded videos, HLS chunks, logos and thumbnails across container redeploys
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    networks:
      - armss-net

  # React Web Frontend & Nginx Single Entry Reverse Proxy (The ONLY exposed port)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: creator_frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Single public port: serves Frontend Web SPA + proxies /api/, /playback/, /thumbnails/, /logos/, /data/
    ports:
      - "${PORT:-2085}:80"
    networks:
      - armss-net

networks:
  armss-net:
    driver: bridge

services:
  # Dedicated Project MySQL Database Container (Isolated from host MySQL)
  mysql:
    image: mysql:8.0
    container_name: creator_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword@2026}
      MYSQL_DATABASE: ${DB_NAME:-creator_platform}
      MYSQL_USER: ${DB_USER:-creator_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-creator_pass@2026}
    # No host port exposed! MySQL is completely private to armss-net to prevent collision with host 3306
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword@2026}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - armss-net

  # Go Backend API Service (Connects to dedicated 'mysql' container)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creator_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PORT=2085
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-creator_user}
      - DB_PASSWORD=${DB_PASSWORD:-creator_pass@2026}
      - DB_NAME=${DB_NAME:-creator_platform}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${DB_USER:-creator_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-creator_pass@2026}
      - MYSQL_DATABASE=${DB_NAME:-creator_platform}
      - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL:-https://entertainment.aurapictures.online}
      - PLAYBACK_TOKEN_REQUIRED=${PLAYBACK_TOKEN_REQUIRED:-false}
    # Internal only: backend communicates with frontend via armss-net
    expose:
      - "2085"
    volumes:
      # CRITICAL: Persists uploaded videos, HLS chunks, logos and thumbnails across container redeploys
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    networks:
      - armss-net

  # React Web Frontend & Nginx Single Entry Reverse Proxy (The ONLY exposed port on host)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: creator_frontend
    restart: unless-stopped
    depends_on:
      - backend
    # The ONLY public port: serves Web App UI + proxies /api/, /playback/, /thumbnails/, /logos/, /data/
    ports:
      - "${PORT:-2085}:80"
    networks:
      - armss-net

networks:
  armss-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
